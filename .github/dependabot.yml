# Security alerts already arrive on their own; this is what opens the pull
# request that fixes them, and keeps the rest from drifting so far that an
# upgrade becomes a project.
#
# Weekly, not daily: this repo changes in bursts, and a daily cadence would
# mean a queue of PRs nobody reads.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch and minor bumps. Majors stay separate,
      # because those are the ones that need a person to read a changelog.
      minor-and-patch:
        update-types: [minor, patch]
      # React and react-dom are one release, and their peer ranges name each
      # other. Split across two PRs each half is uninstallable on its own:
      # npm ci fails on ERESOLVE before anything is built, so both PRs and
      # both preview deployments go red for a reason that is not in the code.
      # Grouped, they arrive as the single upgrade they actually are.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
    ignore:
      # ESLint 10 removed context.getFilename(), and the eslint-plugin-react
      # bundled inside eslint-config-next 16 still calls it, so every lint run
      # throws. Closing the PR only skips that one version; this stops the
      # weekly reopen. Remove it once eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # TypeScript 7.0 ships no JavaScript API, so typescript-eslint cannot
      # load it, and running 6 and 7 side by side is not worth maintaining
      # here. Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the oldest Node that runs this site: Vercel is on
      # 22 (local and CI run 24 from .nvmrc). Newer types would let code use
      # APIs production does not have. Raise it when Vercel moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: "[Deps]"

  # The CI workflow pins actions by major version; this keeps those current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "[CI]"
